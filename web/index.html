<!doctype html>
<html lang="en" data-wasm-size="__WASM_SIZE__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#181425">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Critters">
<meta name="description" content="A cosy adventure for young explorers, with talking critters and small quests.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Critter Kingdom</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #181425;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  #start {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 3vmin, 24px);
    padding: 24px;
    box-sizing: border-box;
    background: linear-gradient(#63c74d, #3e8948);
    color: #fff;
    font: 600 18px/1.3 ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
    text-align: center;
  }

  #start.stopped {
    cursor: pointer;
  }

  .critter {
    width: clamp(96px, 28vmin, 180px);
    height: auto;
    animation: bob 1.2s ease-in-out infinite;
  }

  @keyframes bob {
    50% { transform: translateY(-5%); }
  }

  h1 {
    margin: 0;
    font-size: clamp(28px, 7vmin, 56px);
    letter-spacing: 0.02em;
    text-shadow: 0 3px 0 rgba(62, 39, 49, 0.6);
  }

  #bar {
    width: min(60vw, 320px);
    height: 16px;
    border-radius: 8px;
    background: rgba(24, 20, 37, 0.35);
    overflow: hidden;
  }

  #bar > div {
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: #fee761;
    transition: width 0.15s linear;
  }

  #bar.waiting > div {
    width: 35%;
    animation: slide 1.1s ease-in-out infinite alternate;
  }

  @keyframes slide {
    from { transform: translateX(-20%); }
    to { transform: translateX(206%); }
  }

  #play {
    display: grid;
    place-items: center;
    width: clamp(96px, 26vmin, 160px);
    height: clamp(96px, 26vmin, 160px);
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: #feae34;
    box-shadow: 0 6px 0 #d77643;
    color: #fff;
    cursor: pointer;
    animation: pop 0.3s ease-out;
  }

  #play:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #d77643;
  }

  #play:focus-visible {
    outline: 4px solid #fff;
    outline-offset: 4px;
  }

  #play svg {
    width: 46%;
    height: 46%;
    margin-left: 8%;
  }

  @keyframes pop {
    from { transform: scale(0.6); opacity: 0; }
  }

  #message {
    margin: 0;
    max-width: 30em;
    font-size: clamp(18px, 3.4vmin, 24px);
  }

  #message:empty {
    display: none;
  }

  #details {
    max-width: min(90vw, 60em);
    max-height: 30vh;
    margin: 0;
    padding: 12px;
    overflow: auto;
    border-radius: 8px;
    background: rgba(24, 20, 37, 0.6);
    font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
    text-align: left;
    white-space: pre-wrap;
    -webkit-user-select: text;
    user-select: text;
  }

  #start[hidden], #bar[hidden], #play[hidden], #details[hidden] {
    display: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .critter, #play, #bar.waiting > div {
      animation: none;
    }
    #bar.waiting > div {
      width: 100%;
      opacity: 0.5;
    }
    #bar > div {
      transition: none;
    }
  }
</style>
<noscript><style>#bar { display: none; }</style></noscript>
</head>
<body>
<div id="start">
  <svg class="critter" viewBox="2 1 16 21" aria-hidden="true">
    <path d="M6 17h8v1H6zM5 18h10v2H5zM6 20h8v1H6z" fill="#000" fill-opacity="0.24"/>
    <path d="M4 9 5 2 9 6zM16 9 15 2 11 6z" fill="#f77622"/>
    <circle cx="10" cy="12" r="7" fill="#f77622"/>
    <circle cx="10" cy="15" r="4" fill="#ead4aa"/>
    <path d="M7 10h1v2H7zM12 10h1v2h-1z" fill="#181425"/>
    <path d="M9 12h2v1H9z" fill="#3e2731"/>
  </svg>
  <h1>Critter Kingdom</h1>
  <div id="bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100"><div></div></div>
  <button id="play" type="button" aria-label="Play" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17a1 1 0 0 0 1.5.86l14-8.5a1 1 0 0 0 0-1.72l-14-8.5A1 1 0 0 0 6 3.5z" fill="currentColor"/></svg>
  </button>
  <p id="message" role="status"></p>
  <pre id="details" hidden></pre>
  <noscript><p>Critter Kingdom needs JavaScript to run.</p></noscript>
</div>
<script src="wasm_exec.js"></script>
<script src="loader.js"></script>
</body>
</html>
