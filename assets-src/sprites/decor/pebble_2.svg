<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Ground decoration pebble_2: a big and a small pebble side by side.
       16 by 16 world px. Cool grey with the 8 px round slate blue outline, a
       pale slate highlight on each top-left and soft ink shadows below. -->
