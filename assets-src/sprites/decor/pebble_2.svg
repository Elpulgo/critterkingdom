    <ellipse cx="58" cy="72" rx="24" ry="10"/>
    <ellipse cx="88" cy="88" rx="15" ry="7"/>
  </g>
  <g fill="#8b9bb4" stroke="#5a6988" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="54" cy="62" rx="20" ry="14"/>
    <ellipse cx="85" cy="81" rx="12" ry="9"/>
  </g>
  <g fill="#c0cbdc" stroke="none">
    <ellipse cx="47" cy="56" rx="7" ry="4"/>
    <ellipse cx="81" cy="77" rx="4" ry="2"/>
  </g>
</svg>
