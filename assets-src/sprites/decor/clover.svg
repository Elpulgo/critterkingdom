<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Ground decoration clover: a three-leaf clover seen from above, on a short
       stalk. 16 by 16 world px. Leaf green leaflets and stalk with the 8 px
       round pine green outline; each leaflet has a meadow green highlight on
       its top-left, towards the light. -->
  <g stroke="#265c42" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 64 68 C 66 80 68 88 74 96" fill="none"/>
    <g fill="#3e8948">
      <circle cx="64" cy="44" r="16"/>
      <circle cx="80" cy="70" r="16"/>
      <circle cx="48" cy="70" r="16"/>
    </g>
  </g>
  <g fill="#63c74d" stroke="none">
    <ellipse cx="58" cy="39" rx="5" ry="3"/>
    <ellipse cx="74" cy="65" rx="5" ry="3"/>
    <ellipse cx="42" cy="65" rx="5" ry="3"/>
  </g>
</svg>
