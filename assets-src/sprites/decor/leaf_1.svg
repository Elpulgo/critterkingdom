    <path d="M 36 88 L 24 100" fill="none"/>
    <path d="M 36 88 C 36 56 60 36 96 34 C 96 70 72 92 36 88 Z"/>
  </g>
  <path d="M 42 82 C 56 70 72 56 88 42" fill="none" stroke="#265c42" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="56" cy="58" rx="8" ry="4" transform="rotate(-45 56 58)" fill="#63c74d" stroke="none"/>
</svg>
