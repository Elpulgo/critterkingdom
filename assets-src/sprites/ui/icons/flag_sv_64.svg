<?xml version="1.0" encoding="UTF-8"?>
<!-- Swedish flag icon (language picker), 128 by 128 px (64 by 64 CSS px menu
     size at 2 px per CSS px). A rounded pond blue flag with a sunny yellow
     Nordic cross, its upright set toward the pole side (5:2:9 across, 4:2:4 down). -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="128" height="128" viewBox="0 0 128 128">
  <!-- Soft drop shadow, the flag 6 px lower -->
  <g id="flag_sv_64_shadow" transform="translate(0 6)" opacity="0.22">
    <rect x="12" y="28" width="104" height="68" rx="12" fill="#181425" stroke="#181425" stroke-width="6"/>
  </g>
  <!-- Pond blue field -->
  <rect id="flag_sv_64_field" x="12" y="28" width="104" height="68" rx="12" fill="#0099db" stroke="none"/>
  <!-- Sunny yellow Nordic cross; the arms end on the straight edges, so no clipping is needed -->
  <rect id="flag_sv_64_cross_across" x="12" y="55" width="104" height="14" fill="#fee761" stroke="none"/>
  <rect id="flag_sv_64_cross_down" x="44" y="28" width="14" height="68" fill="#fee761" stroke="none"/>
  <!-- Sky cyan highlight in the upper-left of the field -->
  <path id="flag_sv_64_highlight" d="M 22 44 Q 22 38 28 38 H 34" fill="none" stroke="#2ce8f5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Deep water blue outline on top -->
  <rect id="flag_sv_64_outline" x="12" y="28" width="104" height="68" rx="12" fill="none" stroke="#124e89" stroke-width="6"/>
</svg>
