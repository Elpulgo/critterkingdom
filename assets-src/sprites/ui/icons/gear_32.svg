<?xml version="1.0" encoding="UTF-8"?>
<!-- Gear icon (settings), 64 by 64 px (32 by 32 CSS px HUD size at 2 px per
     CSS px). A cool grey eight-tooth gear with a round hub, the simplified
     redraw of gear_64.svg with wider teeth so each keeps 4 px of fill. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="64" height="64" viewBox="0 0 64 64">
  <!-- Soft drop shadow, the gear 6 px lower -->
  <g id="gear_32_shadow" transform="translate(0 6)" opacity="0.22">
    <path d="M 27.8 11.5 L 27.7 4.4 L 36.3 4.4 L 36.2 11.5 L 41.4 13.7 L 46.3 8.5 L 52.5 14.7 L 47.3 19.6 L 49.5 24.8 L 56.6 24.7 L 56.6 33.3 L 49.5 33.2 L 47.3 38.4 L 52.5 43.3 L 46.3 49.5 L 41.4 44.3 L 36.2 46.5 L 36.3 53.6 L 27.7 53.6 L 27.8 46.5 L 22.6 44.3 L 17.7 49.5 L 11.5 43.3 L 16.7 38.4 L 14.5 33.2 L 7.4 33.3 L 7.4 24.7 L 14.5 24.8 L 16.7 19.6 L 11.5 14.7 L 17.7 8.5 L 22.6 13.7 Z" fill="#181425" stroke="#181425" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- Cool grey gear with slate blue outline -->
  <path id="gear_32_body" d="M 27.8 11.5 L 27.7 4.4 L 36.3 4.4 L 36.2 11.5 L 41.4 13.7 L 46.3 8.5 L 52.5 14.7 L 47.3 19.6 L 49.5 24.8 L 56.6 24.7 L 56.6 33.3 L 49.5 33.2 L 47.3 38.4 L 52.5 43.3 L 46.3 49.5 L 41.4 44.3 L 36.2 46.5 L 36.3 53.6 L 27.7 53.6 L 27.8 46.5 L 22.6 44.3 L 17.7 49.5 L 11.5 43.3 L 16.7 38.4 L 14.5 33.2 L 7.4 33.3 L 7.4 24.7 L 14.5 24.8 L 16.7 19.6 L 11.5 14.7 L 17.7 8.5 L 22.6 13.7 Z" fill="#8b9bb4" stroke="#5a6988" stroke-width="4" stroke-linejoin="round"/>
  <!-- Pale slate highlight on the upper-left of the ring -->
  <path id="gear_32_highlight" d="M 20 25 Q 23 17 31 15" fill="none" stroke="#c0cbdc" stroke-width="4" stroke-linecap="round"/>
  <!-- Hub: slate blue hole with its own outline -->
  <circle id="gear_32_hub" cx="32" cy="29" r="7" fill="#5a6988" stroke="#3a4466" stroke-width="4"/>
</svg>
