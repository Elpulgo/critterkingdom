<?xml version="1.0" encoding="UTF-8"?>
<!-- Lantern icon, 128 by 128 px (64 by 64 CSS px menu size at 2 px per CSS px).
     A wooden lantern with a glowing sunny yellow glass and a marigold flame. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="128" height="128" viewBox="0 0 128 128">
  <!-- Soft drop shadow, the lantern 6 px lower -->
  <g id="lantern_64_shadow" transform="translate(0 6)" opacity="0.22">
    <path d="M 46 30 Q 46 10 64 10 Q 82 10 82 30" fill="none" stroke="#181425" stroke-width="6" stroke-linecap="round"/>
    <rect x="38" y="36" width="52" height="62" rx="12" fill="#181425" stroke="#181425" stroke-width="6"/>
    <rect x="32" y="26" width="64" height="16" rx="8" fill="#181425" stroke="#181425" stroke-width="6"/>
    <rect x="32" y="92" width="64" height="16" rx="8" fill="#181425" stroke="#181425" stroke-width="6"/>
  </g>
  <!-- Bark brown handle -->
  <path id="lantern_64_handle" d="M 46 30 Q 46 10 64 10 Q 82 10 82 30" fill="none" stroke="#733e39" stroke-width="6" stroke-linecap="round"/>
  <!-- Glowing glass -->
  <rect id="lantern_64_glass" x="38" y="36" width="52" height="62" rx="12" fill="#fee761" stroke="#733e39" stroke-width="6"/>
  <!-- Flame: marigold with fox orange outline -->
  <path id="lantern_64_flame" d="M 64 50 Q 78 68 72 78 Q 64 88 56 78 Q 50 68 64 50 Z" fill="#feae34" stroke="#f77622" stroke-width="4" stroke-linejoin="round"/>
  <!-- White glint on the glass, upper left -->
  <rect id="lantern_64_highlight" x="44" y="46" width="6" height="20" rx="3" fill="#ffffff" stroke="none"/>
  <!-- Wood brown cap and base -->
  <rect id="lantern_64_cap" x="32" y="26" width="64" height="16" rx="8" fill="#b86f50" stroke="#733e39" stroke-width="6"/>
  <rect id="lantern_64_base" x="32" y="92" width="64" height="16" rx="8" fill="#b86f50" stroke="#733e39" stroke-width="6"/>
</svg>
