<?xml version="1.0" encoding="UTF-8"?>
<!-- Backpack icon, 128 by 128 px (64 by 64 CSS px menu size at 2 px per CSS px).
     A wood brown backpack with a light tan flap, a front pocket and a marigold buckle. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="128" height="128" viewBox="0 0 128 128">
  <!-- Soft drop shadow, the bag and handle 6 px lower -->
  <g id="backpack_64_shadow" transform="translate(0 6)" opacity="0.22">
    <path d="M 48 28 Q 48 14 64 14 Q 80 14 80 28" fill="none" stroke="#181425" stroke-width="8" stroke-linecap="round"/>
    <rect x="24" y="24" width="80" height="84" rx="24" fill="#181425" stroke="#181425" stroke-width="6"/>
  </g>
  <!-- Bark brown carry handle -->
  <path id="backpack_64_handle" d="M 48 28 Q 48 14 64 14 Q 80 14 80 28" fill="none" stroke="#733e39" stroke-width="8" stroke-linecap="round"/>
  <!-- Wood brown bag -->
  <rect id="backpack_64_body" x="24" y="24" width="80" height="84" rx="24" fill="#b86f50" stroke="none"/>
  <!-- Light tan flap over the top, with its bottom edge -->
  <path id="backpack_64_flap" d="M 24 56 V 48 Q 24 24 48 24 H 80 Q 104 24 104 48 V 56 Q 64 72 24 56 Z" fill="#e4a672" stroke="none"/>
  <path id="backpack_64_flap_edge" d="M 24 56 Q 64 72 104 56" fill="none" stroke="#733e39" stroke-width="6" stroke-linecap="round"/>
  <!-- Cream highlight on the upper-left of the flap -->
  <ellipse id="backpack_64_highlight" cx="40" cy="38" rx="8" ry="5" transform="rotate(-25 40 38)" fill="#ead4aa" stroke="none"/>
  <!-- Front pocket -->
  <rect id="backpack_64_pocket" x="40" y="76" width="48" height="24" rx="10" fill="#e4a672" stroke="#733e39" stroke-width="6"/>
  <!-- Bag outline on top -->
  <rect id="backpack_64_outline" x="24" y="24" width="80" height="84" rx="24" fill="none" stroke="#733e39" stroke-width="6"/>
  <!-- Marigold buckle on the flap -->
  <rect id="backpack_64_buckle" x="56" y="58" width="16" height="14" rx="4" fill="#feae34" stroke="#d77643" stroke-width="4"/>
</svg>
