<?xml version="1.0" encoding="UTF-8"?>
<!-- Zzz icon (sleep), 128 by 128 px (64 by 64 CSS px menu size at 2 px per CSS px).
     Three sky cyan Z letters, big to small, rising to the upper right.
     Each letter is an 18 px deep water blue stroke under a 6 px sky cyan
     stroke, which gives a 6 px outline. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="128" height="128" viewBox="0 0 128 128">
  <!-- Soft drop shadow, the letters 6 px lower -->
  <g id="zzz_64_shadow" transform="translate(0 6)" opacity="0.22" fill="none" stroke="#181425" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 12 76 H 42 L 12 106 H 42"/>
    <path d="M 62 46 H 84 L 62 68 H 84"/>
    <path d="M 98 16 H 112 L 98 30 H 112"/>
  </g>
  <g id="zzz_64_big" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 12 76 H 42 L 12 106 H 42" stroke="#124e89" stroke-width="18"/>
    <path d="M 12 76 H 42 L 12 106 H 42" stroke="#2ce8f5" stroke-width="6"/>
  </g>
  <g id="zzz_64_middle" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 62 46 H 84 L 62 68 H 84" stroke="#124e89" stroke-width="18"/>
    <path d="M 62 46 H 84 L 62 68 H 84" stroke="#2ce8f5" stroke-width="6"/>
  </g>
  <g id="zzz_64_small" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 98 16 H 112 L 98 30 H 112" stroke="#124e89" stroke-width="18"/>
    <path d="M 98 16 H 112 L 98 30 H 112" stroke="#2ce8f5" stroke-width="6"/>
  </g>
</svg>
