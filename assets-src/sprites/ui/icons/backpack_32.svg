<?xml version="1.0" encoding="UTF-8"?>
<!-- Backpack icon, 64 by 64 px (32 by 32 CSS px HUD size at 2 px per CSS px).
     A wood brown backpack with a light tan flap, a front pocket and a marigold
     buckle, the simplified redraw of backpack_64.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="64" height="64" viewBox="0 0 64 64">
  <!-- Soft drop shadow, the bag and handle 6 px lower -->
  <g id="backpack_32_shadow" transform="translate(0 6)" opacity="0.22">
    <path d="M 24 13 Q 24 6 32 6 Q 40 6 40 13" fill="none" stroke="#181425" stroke-width="4" stroke-linecap="round"/>
    <rect x="12" y="11" width="40" height="42" rx="12" fill="#181425" stroke="#181425" stroke-width="4"/>
  </g>
  <!-- Bark brown carry handle -->
  <path id="backpack_32_handle" d="M 24 13 Q 24 6 32 6 Q 40 6 40 13" fill="none" stroke="#733e39" stroke-width="4" stroke-linecap="round"/>
  <!-- Wood brown bag -->
  <rect id="backpack_32_body" x="12" y="11" width="40" height="42" rx="12" fill="#b86f50" stroke="none"/>
  <!-- Light tan flap over the top, with its bottom edge -->
  <path id="backpack_32_flap" d="M 12 27 V 23 Q 12 11 24 11 H 40 Q 52 11 52 23 V 27 Q 32 35 12 27 Z" fill="#e4a672" stroke="none"/>
  <path id="backpack_32_flap_edge" d="M 12 27 Q 32 35 52 27" fill="none" stroke="#733e39" stroke-width="4" stroke-linecap="round"/>
  <!-- Cream highlight on the upper-left of the flap -->
  <ellipse id="backpack_32_highlight" cx="20" cy="18" rx="4" ry="2.5" transform="rotate(-25 20 18)" fill="#ead4aa" stroke="none"/>
  <!-- Front pocket -->
  <rect id="backpack_32_pocket" x="20" y="39" width="24" height="9" rx="4" fill="#e4a672" stroke="#733e39" stroke-width="4"/>
  <!-- Bag outline on top -->
  <rect id="backpack_32_outline" x="12" y="11" width="40" height="42" rx="12" fill="none" stroke="#733e39" stroke-width="4"/>
  <!-- Marigold buckle on the flap -->
  <rect id="backpack_32_buckle" x="27" y="27" width="10" height="9" rx="3" fill="#feae34" stroke="#d77643" stroke-width="4"/>
</svg>
