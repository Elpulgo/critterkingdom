<?xml version="1.0" encoding="UTF-8"?>
<!-- Footsteps icon, 64 by 64 px (32 by 32 CSS px HUD size at 2 px per CSS px).
     Two round paw prints walking up to the right, the simplified redraw of
     footsteps_64.svg: the toes are spread so their outlines do not touch. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="64" height="64" viewBox="0 0 64 64">
  <!-- Soft drop shadow, both prints 6 px lower -->
  <g id="footsteps_32_shadow" transform="translate(0 6)" opacity="0.22" fill="#181425" stroke="#181425" stroke-width="4">
    <ellipse cx="20" cy="46" rx="7" ry="8"/>
    <circle cx="9" cy="33" r="4"/>
    <circle cx="20" cy="27" r="4"/>
    <circle cx="31" cy="33" r="4"/>
    <ellipse cx="46" cy="27" rx="7" ry="8"/>
    <circle cx="35" cy="14" r="4"/>
    <circle cx="46" cy="8" r="4"/>
    <circle cx="57" cy="14" r="4"/>
  </g>
  <!-- Lower-left print: wood brown pad and toes with bark brown outline -->
  <g id="footsteps_32_print_left" fill="#b86f50" stroke="#733e39" stroke-width="4">
    <ellipse cx="20" cy="46" rx="7" ry="8"/>
    <circle cx="9" cy="33" r="4"/>
    <circle cx="20" cy="27" r="4"/>
    <circle cx="31" cy="33" r="4"/>
  </g>
  <!-- Upper-right print -->
  <g id="footsteps_32_print_right" fill="#b86f50" stroke="#733e39" stroke-width="4">
    <ellipse cx="46" cy="27" rx="7" ry="8"/>
    <circle cx="35" cy="14" r="4"/>
    <circle cx="46" cy="8" r="4"/>
    <circle cx="57" cy="14" r="4"/>
  </g>
  <!-- Highlight dabs on the pads, top-left -->
  <ellipse id="footsteps_32_highlight_left" cx="17" cy="43" rx="3" ry="2" fill="#e4a672" stroke="none"/>
  <ellipse id="footsteps_32_highlight_right" cx="43" cy="24" rx="3" ry="2" fill="#e4a672" stroke="none"/>
</svg>
