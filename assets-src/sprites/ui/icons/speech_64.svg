<?xml version="1.0" encoding="UTF-8"?>
<!-- Speech icon, 128 by 128 px (64 by 64 CSS px menu size at 2 px per CSS px).
     A white speech bubble with its tail at the lower left and three cocoa dots. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="128" height="128" viewBox="0 0 128 128">
  <!-- Soft drop shadow, the bubble 6 px lower -->
  <g id="speech_64_shadow" transform="translate(0 6)" opacity="0.22">
    <path d="M 44 18 H 84 Q 112 18 112 46 V 54 Q 112 82 84 82 H 62 L 36 104 L 42 82 Q 16 82 16 54 V 46 Q 16 18 44 18 Z" fill="#181425" stroke="#181425" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <!-- White bubble with pale slate outline -->
  <path id="speech_64_body" d="M 44 18 H 84 Q 112 18 112 46 V 54 Q 112 82 84 82 H 62 L 36 104 L 42 82 Q 16 82 16 54 V 46 Q 16 18 44 18 Z" fill="#ffffff" stroke="#8b9bb4" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Shade along the lower-right curve -->
  <path id="speech_64_shade" d="M 104 52 Q 104 74 82 74 H 66" fill="none" stroke="#c0cbdc" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Three talk dots -->
  <circle id="speech_64_dot_1" cx="44" cy="50" r="7" fill="#3e2731" stroke="none"/>
  <circle id="speech_64_dot_2" cx="64" cy="50" r="7" fill="#3e2731" stroke="none"/>
  <circle id="speech_64_dot_3" cx="84" cy="50" r="7" fill="#3e2731" stroke="none"/>
</svg>
