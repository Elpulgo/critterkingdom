<?xml version="1.0" encoding="UTF-8"?>
<!-- Touch pad knob, 112 by 112 px (56 by 56 CSS px at 2 px per CSS px,
     padKnobRadius 28 CSS px in internal/engine/touch.go). A round white knob
     with a slate blue outline, a pale slate shade on its lower-right and a
     pale slate thumb dimple, centred on the page so the engine can place it
     under the finger. Same colours as joystick_ring.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="112" height="112" viewBox="0 0 112 112">
  <!-- Soft drop shadow, the knob 6 px lower -->
  <circle id="joystick_knob_shadow" cx="56" cy="62" r="46" fill="#181425" stroke="#181425" stroke-width="6" opacity="0.22"/>
  <!-- White knob -->
  <circle id="joystick_knob_body" cx="56" cy="56" r="46" fill="#ffffff" stroke="none"/>
  <!-- Pale slate shade along the lower-right edge -->
  <path id="joystick_knob_shade" d="M 96 56 A 40 40 0 0 1 56 96" fill="none" stroke="#c0cbdc" stroke-width="8" stroke-linecap="round"/>
  <!-- Thumb dimple -->
  <circle id="joystick_knob_dimple" cx="56" cy="56" r="20" fill="none" stroke="#c0cbdc" stroke-width="4"/>
  <!-- Slate blue outline on top -->
  <circle id="joystick_knob_outline" cx="56" cy="56" r="46" fill="none" stroke="#5a6988" stroke-width="6"/>
</svg>
