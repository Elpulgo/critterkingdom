<?xml version="1.0" encoding="UTF-8"?>
<!-- Checkmark, 64 by 64 px (32 by 32 CSS px HUD size at 2 px per CSS px).
     A thick rounded tick: a 16 px pine green stroke under an 8 px meadow green
     stroke gives a 4 px outline. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="64" height="64" viewBox="0 0 64 64">
  <!-- Soft drop shadow, 4 px lower -->
  <path id="checkmark_shadow" d="M 16 38 L 27 49 L 48 24" fill="none" stroke="#181425" stroke-opacity="0.22" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Pine green outline -->
  <path id="checkmark_outline" d="M 16 34 L 27 45 L 48 20" fill="none" stroke="#265c42" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Meadow green body -->
  <path id="checkmark_body" d="M 16 34 L 27 45 L 48 20" fill="none" stroke="#63c74d" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
