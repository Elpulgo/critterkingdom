<?xml version="1.0" encoding="UTF-8"?>
<!-- Empty boss star, 96 by 96 px (48 by 48 CSS px at 2 px per CSS px).
     A lost star of the Grumbling Grub's health row: the same outline path as
     star_full.svg, filled in muted pale slate with a slate blue outline and no
     shade or highlight, so a row of full and empty stars lines up. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="96" height="96" viewBox="0 0 96 96">
  <!-- Soft drop shadow, the star 6 px lower -->
  <path id="star_empty_shadow" d="M 48 13 L 58.3 34.8 L 82.2 37.9 L 64.6 54.4 L 69.2 78.1 L 48 66.5 L 26.8 78.1 L 31.4 54.4 L 13.8 37.9 L 37.7 34.8 Z" transform="translate(0 6)" opacity="0.22" fill="#181425" stroke="#181425" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Pale slate fill with slate blue outline -->
  <path id="star_empty_body" d="M 48 13 L 58.3 34.8 L 82.2 37.9 L 64.6 54.4 L 69.2 78.1 L 48 66.5 L 26.8 78.1 L 31.4 54.4 L 13.8 37.9 L 37.7 34.8 Z" fill="#c0cbdc" stroke="#5a6988" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
