<?xml version="1.0" encoding="UTF-8"?>
<!-- 9-slice panel, 96 by 96 px (48 by 48 CSS px at 2 px per CSS px).
     Insets: 32 px (16 CSS px) on every side. Corners, outline, highlight
     strip, shade strip and drop shadow all stay inside the insets, so the
     middle 32 by 32 px is plain cream and stretches cleanly. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="96" height="96" viewBox="0 0 96 96">
  <!-- Soft drop shadow, 6 px lower than the card -->
  <rect id="panel_shadow" x="4" y="10" width="88" height="82" rx="20" fill="#181425" fill-opacity="0.22" stroke="none"/>
  <!-- Cream card body -->
  <rect id="panel_body" x="4" y="4" width="88" height="82" rx="20" fill="#ead4aa" stroke="none"/>
  <!-- Top highlight strip (white) and bottom shade strip (peach), light from the top-left -->
  <rect id="panel_highlight" x="16" y="10" width="64" height="6" rx="3" fill="#ffffff" stroke="none"/>
  <rect id="panel_shade" x="16" y="74" width="64" height="6" rx="3" fill="#e8b796" stroke="none"/>
  <!-- Warm taupe outline -->
  <rect id="panel_outline" x="4" y="4" width="88" height="82" rx="20" fill="none" stroke="#c28569" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
