<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Prop rock: a round boulder, 16 by 16 world px. Cool grey outlined in
       slate blue, a slate blue shade crescent on the lower right, a pale slate
       highlight on the upper left, one small crack and a soft ink shadow
       below. -->
  <defs>
    <clipPath id="rock">
      <path d="M 20 90 C 14 66 28 40 54 32 C 74 26 98 32 108 52 C 118 70 114 90 100 98 C 76 106 40 106 20 90 Z"/>
    </clipPath>
  </defs>

  <ellipse cx="66" cy="100" rx="50" ry="10" fill="#181425" fill-opacity="0.22" stroke="none"/>

  <g clip-path="url(#rock)" stroke="none">
    <rect x="0" y="0" width="128" height="128" fill="#5a6988"/>
    <ellipse cx="58" cy="60" rx="50" ry="36" fill="#8b9bb4"/>
    <ellipse cx="46" cy="50" rx="16" ry="9" transform="rotate(-30 46 50)" fill="#c0cbdc"/>
    <circle cx="68" cy="40" r="5" fill="#c0cbdc"/>
  </g>
  <path d="M 76 46 L 82 58 L 76 70" fill="none" stroke="#5a6988" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 20 90 C 14 66 28 40 54 32 C 74 26 98 32 108 52 C 118 70 114 90 100 98 C 76 106 40 106 20 90 Z" fill="none" stroke="#5a6988" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
