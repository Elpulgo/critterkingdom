<svg xmlns="http://www.w3.org/2000/svg" width="128" height="256" viewBox="0 0 128 256">
  <!-- Prop sunflower_checkpoint: a tall sunflower that marks a checkpoint, 16
       by 32 world px. A leaf green stem with an 8 px pine green edge (a 24 px
       pine green stroke under an 8 px leaf green one) and two leaf green
       leaves outlined in pine green; a ring of twelve sunny yellow petals
       outlined in marigold round a bark brown heart outlined in cocoa, with
       wood brown seed dots and a highlight on its upper left; a soft ink
       shadow at the foot of the stem. -->
  <defs>
    <clipPath id="heart"><circle cx="64" cy="76" r="26"/></clipPath>
  </defs>

  <ellipse cx="68" cy="240" rx="30" ry="8" fill="#181425" fill-opacity="0.22" stroke="none"/>

  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Stem -->
    <path d="M 64 236 C 64 190 60 150 64 100" fill="none" stroke="#265c42" stroke-width="24"/>
    <path d="M 64 236 C 64 190 60 150 64 100" fill="none" stroke="#3e8948" stroke-width="8"/>

    <!-- Leaves, each with a vein -->
    <g fill="#3e8948" stroke="#265c42" stroke-width="8">
      <ellipse cx="38" cy="170" rx="24" ry="11" transform="rotate(30 38 170)"/>
      <ellipse cx="88" cy="200" rx="24" ry="11" transform="rotate(-30 88 200)"/>
    </g>
    <g fill="none" stroke="#265c42" stroke-width="6">
      <path d="M 54 180 L 26 163"/>
      <path d="M 72 210 L 100 193"/>
    </g>

    <!-- Petals -->
    <g fill="#fee761" stroke="#feae34" stroke-width="8">
      <ellipse cx="64" cy="42" rx="13" ry="20" transform="rotate(0 64 76)"/>
      <ellipse cx="64" cy="42" rx="13" ry="20" transform="rotate(30 64 76)"/>
      <ellipse cx="64" cy="42" rx="13" ry="20" transform="rotate(60 64 76)"/>
      <ellipse cx="64" cy="42" rx="13" ry="20" transform="rotate(90 64 76)"/>
      <ellipse cx="64" cy="42" rx="13" ry="20" transform="rotate(120 64 76)"/>
      <ellipse cx="64" cy="42" rx="13" ry="20" transform="rotate(150 64 76)"/>
      <ellipse cx="64" cy="42" rx="13" ry="20" transform="rotate(180 64 76)"/>
      <ellipse cx="64" cy="42" rx="13" ry="20" transform="rotate(210 64 76)"/>
      <ellipse cx="64" cy="42" rx="13" ry="20" transform="rotate(240 64 76)"/>
      <ellipse cx="64" cy="42" rx="13" ry="20" transform="rotate(270 64 76)"/>
      <ellipse cx="64" cy="42" rx="13" ry="20" transform="rotate(300 64 76)"/>
      <ellipse cx="64" cy="42" rx="13" ry="20" transform="rotate(330 64 76)"/>
    </g>
  </g>

  <!-- Heart -->
  <g clip-path="url(#heart)" stroke="none">
    <rect x="0" y="0" width="128" height="128" fill="#733e39"/>
    <ellipse cx="54" cy="66" rx="12" ry="7" transform="rotate(-35 54 66)" fill="#b86f50"/>
    <g fill="#b86f50">
      <circle cx="72" cy="70" r="4"/>
      <circle cx="62" cy="84" r="4"/>
      <circle cx="78" cy="86" r="4"/>
      <circle cx="48" cy="82" r="4"/>
      <circle cx="66" cy="96" r="4"/>
    </g>
  </g>
  <circle cx="64" cy="76" r="26" fill="none" stroke="#3e2731" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
