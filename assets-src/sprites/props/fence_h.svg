<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Prop fence_h: one cell of a fence running left to right, 16 by 16 world
       px. Two wood brown rails outlined in bark brown cross the whole cell and
       run on past both page edges, so their outlines join the next fence_h,
       fence_post or fence_gate seamlessly; a post stands in front at the
       centre. Wood gets a light tan highlight (the rails' top edge and the
       post's top face) and a bark brown shade on the right of the post. The
       soft ink shadow is one group at 0.22 opacity, so its overlapping parts
       do not darken twice. -->
  <defs>
    <clipPath id="post"><rect x="48" y="20" width="32" height="84" rx="10"/></clipPath>
  </defs>

  <g fill="#181425" opacity="0.22" stroke="none">
    <rect x="0" y="92" width="128" height="10"/>
    <ellipse cx="66" cy="106" rx="22" ry="7"/>
  </g>
  <g fill="#b86f50" stroke="#733e39" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <rect x="-16" y="34" width="160" height="20" rx="8"/>
    <rect x="-16" y="70" width="160" height="20" rx="8"/>
  </g>
  <g fill="#e4a672" stroke="none">
    <rect x="-16" y="39" width="160" height="5"/>
    <rect x="-16" y="75" width="160" height="5"/>
  </g>
  <rect x="48" y="20" width="32" height="84" rx="10" fill="#b86f50" stroke="none"/>
  <g clip-path="url(#post)" stroke="none">
    <rect x="70" y="20" width="10" height="84" fill="#733e39"/>
    <rect x="52" y="24" width="24" height="10" rx="5" fill="#e4a672"/>
  </g>
  <rect x="48" y="20" width="32" height="84" rx="10" fill="none" stroke="#733e39" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
