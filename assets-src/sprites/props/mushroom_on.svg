<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Prop mushroom_on: the cave mushroom lit up, 16 by 16 world px, on the
       same page as mushroom_off. A sky cyan cap outlined and shaded in pond
       blue, with a white highlight and white spots, a sky cyan glow behind it
       at low opacity and three sparkles. -->
  <defs>
    <clipPath id="cap"><path d="M 22 66 C 22 22 106 22 106 66 Q 64 80 22 66 Z"/></clipPath>
    <clipPath id="stem"><rect x="48" y="60" width="32" height="40" rx="12"/></clipPath>
  </defs>

  <!-- Glow -->
  <circle cx="64" cy="60" r="56" fill="#2ce8f5" fill-opacity="0.25" stroke="none"/>
  <ellipse cx="66" cy="102" rx="36" ry="8" fill="#181425" fill-opacity="0.22" stroke="none"/>

  <!-- Stem -->
  <g clip-path="url(#stem)" stroke="none">
    <rect x="0" y="0" width="128" height="128" fill="#ead4aa"/>
    <rect x="70" y="60" width="10" height="40" fill="#c28569"/>
  </g>
  <rect x="48" y="60" width="32" height="40" rx="12" fill="none" stroke="#c28569" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Cap: the offset fill leaves a shade crescent on the lower right -->
  <g clip-path="url(#cap)" stroke="none">
    <rect x="0" y="0" width="128" height="128" fill="#0099db"/>
    <ellipse cx="54" cy="46" rx="44" ry="24" fill="#2ce8f5"/>
    <ellipse cx="42" cy="46" rx="12" ry="6" transform="rotate(-30 42 46)" fill="#ffffff"/>
    <g fill="#ffffff">
      <circle cx="70" cy="42" r="7"/>
      <circle cx="88" cy="56" r="5"/>
      <circle cx="50" cy="62" r="5"/>
    </g>
  </g>
  <path d="M 22 66 C 22 22 106 22 106 66 Q 64 80 22 66 Z" fill="none" stroke="#0099db" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Sparkles -->
  <g fill="#ffffff" stroke="#2ce8f5" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="16" cy="28" r="3"/>
    <circle cx="112" cy="22" r="4"/>
    <circle cx="110" cy="84" r="3"/>
  </g>
</svg>
