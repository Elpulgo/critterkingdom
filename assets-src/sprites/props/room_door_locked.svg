<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Prop room_door_locked: the room door shut and locked, 16 by 16 world
       px, on the same page as room_door_open. The arch is filled by a wooden
       door: wood brown outlined in bark brown, a light tan highlight on its
       left, a bark brown shade on its right and plank lines, and a marigold
       padlock outlined in warm ochre with a cocoa keyhole. -->
  <defs>
    <clipPath id="frame"><path d="M 14 116 L 14 56 A 50 50 0 0 1 114 56 L 114 116 Z"/></clipPath>
    <clipPath id="opening"><path d="M 34 116 L 34 60 A 30 30 0 0 1 94 60 L 94 116 Z"/></clipPath>
  </defs>

  <!-- Stone arch -->
  <g clip-path="url(#frame)" stroke="none">
    <rect x="0" y="0" width="128" height="128" fill="#8b9bb4"/>
    <rect x="104" y="0" width="10" height="128" fill="#5a6988"/>
    <path d="M 22 56 A 42 42 0 0 1 43 19.6" fill="none" stroke="#c0cbdc" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <g fill="none" stroke="#5a6988" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 14 84 L 34 84"/>
    <path d="M 94 84 L 114 84"/>
    <path d="M 20 34 L 38 44"/>
    <path d="M 108 34 L 90 44"/>
    <path d="M 56 8 L 58 30"/>
    <path d="M 72 8 L 70 30"/>
  </g>
  <path d="M 14 116 L 14 56 A 50 50 0 0 1 114 56 L 114 116 Z" fill="none" stroke="#5a6988" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Doorway -->
  <g clip-path="url(#opening)" stroke="none">
    <rect x="0" y="0" width="128" height="128" fill="#b86f50"/>
    <rect x="34" y="0" width="12" height="128" fill="#e4a672"/>
    <rect x="82" y="0" width="12" height="128" fill="#733e39"/>
  </g>
  <g fill="none" stroke="#733e39" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 54 34 L 54 112"/>
    <path d="M 74 34 L 74 112"/>
  </g>
  <path d="M 34 116 L 34 60 A 30 30 0 0 1 94 60 L 94 116 Z" fill="none" stroke="#733e39" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Padlock -->
  <path d="M 56 76 L 56 68 A 8 8 0 0 1 72 68 L 72 76" fill="none" stroke="#d77643" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="48" y="74" width="32" height="26" rx="6" fill="#feae34" stroke="#d77643" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#3e2731" stroke="none">
    <circle cx="64" cy="84" r="4"/>
    <rect x="62" y="84" width="4" height="10" rx="2"/>
  </g>
</svg>
