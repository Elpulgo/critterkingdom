<svg xmlns="http://www.w3.org/2000/svg" width="128" height="256" viewBox="0 0 128 256">
  <!-- Prop bed: a single bed seen from the front and above, head at the top,
       16 by 32 world px. A wood brown headboard and footboard outlined in bark
       brown, each with a light tan highlight along its top and a bark brown
       shade down its right side, and a blossom pink heart on the headboard. A
       white sheet outlined and shaded in pale slate, a cream pillow (white
       highlight, warm taupe shade and outline) and a pond blue blanket
       outlined in deep water blue with a sky cyan highlight down its left
       side, a deep water blue shade down its right, white dots and the sheet
       folded over its top. A soft ink shadow under the foot. -->
  <defs>
    <clipPath id="headboard"><rect x="12" y="10" width="104" height="56" rx="22"/></clipPath>
    <clipPath id="sheet"><rect x="16" y="48" width="96" height="176" rx="14"/></clipPath>
    <clipPath id="pillow"><rect x="28" y="58" width="72" height="38" rx="16"/></clipPath>
    <clipPath id="blanket"><rect x="12" y="110" width="104" height="110" rx="14"/></clipPath>
    <clipPath id="footboard"><rect x="10" y="200" width="108" height="40" rx="14"/></clipPath>
  </defs>

  <ellipse cx="66" cy="244" rx="56" ry="8" fill="#181425" fill-opacity="0.22" stroke="none"/>

  <!-- Headboard -->
  <g clip-path="url(#headboard)" stroke="none">
    <rect x="0" y="0" width="128" height="128" fill="#b86f50"/>
    <rect x="12" y="10" width="104" height="14" fill="#e4a672"/>
    <rect x="100" y="10" width="16" height="56" fill="#733e39"/>
  </g>
  <rect x="12" y="10" width="104" height="56" rx="22" fill="none" stroke="#733e39" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 64 40 C 52 32 50 24 56 21 C 60 19 63 22 64 24 C 65 22 68 19 72 21 C 78 24 76 32 64 40 Z" fill="#f6757a" stroke="#a22633" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Sheet over the mattress -->
  <g clip-path="url(#sheet)" stroke="none">
    <rect x="0" y="0" width="128" height="256" fill="#ffffff"/>
    <rect x="98" y="48" width="14" height="176" fill="#c0cbdc"/>
  </g>
  <rect x="16" y="48" width="96" height="176" rx="14" fill="none" stroke="#c0cbdc" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Pillow -->
  <g clip-path="url(#pillow)" stroke="none">
    <rect x="0" y="0" width="128" height="128" fill="#ead4aa"/>
    <ellipse cx="48" cy="70" rx="12" ry="6" fill="#ffffff"/>
    <rect x="28" y="84" width="72" height="12" fill="#c28569"/>
  </g>
  <rect x="28" y="58" width="72" height="38" rx="16" fill="none" stroke="#c28569" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Blanket, with the sheet folded over its top -->
  <g clip-path="url(#blanket)" stroke="none">
    <rect x="0" y="0" width="128" height="256" fill="#0099db"/>
    <rect x="12" y="132" width="16" height="88" fill="#2ce8f5"/>
    <rect x="100" y="132" width="16" height="88" fill="#124e89"/>
    <rect x="12" y="110" width="104" height="22" fill="#ffffff"/>
    <rect x="100" y="110" width="16" height="22" fill="#c0cbdc"/>
    <g fill="#ffffff">
      <circle cx="40" cy="150" r="5"/>
      <circle cx="88" cy="150" r="5"/>
      <circle cx="64" cy="168" r="5"/>
      <circle cx="40" cy="186" r="5"/>
      <circle cx="88" cy="186" r="5"/>
    </g>
  </g>
  <path d="M 16 132 L 112 132" fill="none" stroke="#124e89" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="12" y="110" width="104" height="110" rx="14" fill="none" stroke="#124e89" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Footboard -->
  <g clip-path="url(#footboard)" stroke="none">
    <rect x="0" y="128" width="128" height="128" fill="#b86f50"/>
    <rect x="10" y="200" width="108" height="12" fill="#e4a672"/>
    <rect x="102" y="200" width="16" height="40" fill="#733e39"/>
  </g>
  <rect x="10" y="200" width="108" height="40" rx="14" fill="none" stroke="#733e39" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
