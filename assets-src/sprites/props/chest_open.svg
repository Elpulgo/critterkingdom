<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Prop chest_open: the chest from chest_closed with its lid tipped back,
       16 by 16 world px, on the same page so the game can swap one for the
       other in place. The lid stands up behind the body, the open top shows a
       bark brown inside with a cocoa shade under the back wall, and the latch
       hangs open on the front. -->
  <defs>
    <clipPath id="lid"><rect x="14" y="4" width="100" height="34" rx="14"/></clipPath>
    <clipPath id="inside"><rect x="28" y="36" width="72" height="22" rx="6"/></clipPath>
    <clipPath id="body"><rect x="18" y="58" width="92" height="46" rx="10"/></clipPath>
  </defs>

  <ellipse cx="66" cy="106" rx="52" ry="9" fill="#181425" fill-opacity="0.22" stroke="none"/>

  <!-- Lid, tipped back -->
  <g clip-path="url(#lid)" stroke="none">
    <rect x="0" y="0" width="128" height="128" fill="#b86f50"/>
    <rect x="14" y="4" width="100" height="10" fill="#e4a672"/>
    <rect x="30" y="4" width="12" height="34" fill="#feae34"/>
    <rect x="86" y="4" width="12" height="34" fill="#feae34"/>
    <rect x="14" y="28" width="100" height="10" fill="#733e39"/>
    <rect x="30" y="28" width="12" height="10" fill="#d77643"/>
    <rect x="86" y="28" width="12" height="10" fill="#d77643"/>
  </g>
  <rect x="14" y="4" width="100" height="34" rx="14" fill="none" stroke="#733e39" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Open top: the rim around a dark inside -->
  <rect x="18" y="30" width="92" height="34" rx="10" fill="#b86f50" stroke="#733e39" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <g clip-path="url(#inside)" stroke="none">
    <rect x="0" y="0" width="128" height="128" fill="#733e39"/>
    <rect x="28" y="36" width="72" height="8" fill="#3e2731"/>
  </g>

  <!-- Body -->
  <g clip-path="url(#body)" stroke="none">
    <rect x="0" y="0" width="128" height="128" fill="#b86f50"/>
    <rect x="18" y="58" width="92" height="8" fill="#e4a672"/>
    <rect x="30" y="58" width="12" height="46" fill="#feae34"/>
    <rect x="86" y="58" width="12" height="46" fill="#feae34"/>
    <rect x="18" y="92" width="92" height="12" fill="#733e39"/>
    <rect x="30" y="92" width="12" height="12" fill="#d77643"/>
    <rect x="86" y="92" width="12" height="12" fill="#d77643"/>
  </g>
  <rect x="18" y="58" width="92" height="46" rx="10" fill="none" stroke="#733e39" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Latch hanging open on the front -->
  <rect x="54" y="64" width="20" height="18" rx="6" fill="#feae34" stroke="#d77643" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
