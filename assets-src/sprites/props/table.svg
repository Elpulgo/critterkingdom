<svg xmlns="http://www.w3.org/2000/svg" width="256" height="128" viewBox="0 0 256 128">
  <!-- Prop table: a wooden table seen from the front and above, 32 by 16 world
       px. A wood brown top outlined in bark brown, with a light tan highlight
       along its back edge and a bark brown shade on its front edge, standing on
       two wood brown legs shaded bark brown down their right side. On the top:
       a white plate (pale slate rim) with a poppy red apple outlined in berry
       crimson with a blossom pink highlight, a bark brown stem and a leaf green
       leaf, and a pond blue mug outlined in deep water blue with a sky cyan
       highlight. A soft ink shadow underneath. -->
  <defs>
    <clipPath id="top"><rect x="10" y="12" width="236" height="60" rx="18"/></clipPath>
    <clipPath id="leg_left"><rect x="30" y="58" width="24" height="50" rx="8"/></clipPath>
    <clipPath id="leg_right"><rect x="202" y="58" width="24" height="50" rx="8"/></clipPath>
  </defs>

  <ellipse cx="130" cy="112" rx="112" ry="9" fill="#181425" fill-opacity="0.22" stroke="none"/>

  <!-- Legs -->
  <rect x="30" y="58" width="24" height="50" rx="8" fill="#b86f50" stroke="none"/>
  <rect x="42" y="58" width="12" height="50" clip-path="url(#leg_left)" fill="#733e39" stroke="none"/>
  <rect x="30" y="58" width="24" height="50" rx="8" fill="none" stroke="#733e39" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="202" y="58" width="24" height="50" rx="8" fill="#b86f50" stroke="none"/>
  <rect x="214" y="58" width="12" height="50" clip-path="url(#leg_right)" fill="#733e39" stroke="none"/>
  <rect x="202" y="58" width="24" height="50" rx="8" fill="none" stroke="#733e39" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Table top -->
  <g clip-path="url(#top)" stroke="none">
    <rect x="0" y="0" width="256" height="128" fill="#b86f50"/>
    <rect x="10" y="12" width="236" height="14" fill="#e4a672"/>
    <rect x="10" y="56" width="236" height="16" fill="#733e39"/>
  </g>
  <rect x="10" y="12" width="236" height="60" rx="18" fill="none" stroke="#733e39" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Plate with an apple -->
  <ellipse cx="80" cy="40" rx="30" ry="11" fill="#ffffff" stroke="#c0cbdc" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="80" cy="34" r="13" fill="#e43b44" stroke="#a22633" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="76" cy="30" r="4" fill="#f6757a" stroke="none"/>
  <path d="M 81 22 L 83 14" fill="none" stroke="#733e39" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="91" cy="17" rx="7" ry="4" transform="rotate(-20 91 17)" fill="#3e8948" stroke="none"/>

  <!-- Mug -->
  <path d="M 192 28 C 206 28 206 44 192 44" fill="none" stroke="#124e89" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="164" y="20" width="28" height="30" rx="8" fill="#0099db" stroke="#124e89" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="170" y="26" width="6" height="16" rx="3" fill="#2ce8f5" stroke="none"/>
</svg>
